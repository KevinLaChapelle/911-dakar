name: Validate website
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
